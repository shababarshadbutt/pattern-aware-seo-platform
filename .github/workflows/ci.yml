name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Biome covers formatting and almost all lint rules; the second step is
      # the narrow type-aware ESLint pass for no-floating-promises and
      # no-misused-promises. See eslint.config.mjs for why it exists.
      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Lint (type-aware promise rules)
        run: pnpm lint:promises

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
