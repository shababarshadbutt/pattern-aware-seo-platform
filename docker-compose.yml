services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      # Host port is overridable because a natively-installed Postgres or Redis
      # on the default port silently shadows the container: connections succeed
      # against the wrong server and fail on credentials, which is a confusing
      # way to lose an afternoon. Set POSTGRES_PORT / REDIS_PORT in .env when
      # that happens; the container side never changes, so nothing else does.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: seo_platform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: seo_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # No local S3 emulation here on purpose — use a real low-traffic S3
  # dev bucket for S3/SFTP testing so behavior matches production.

  # --- Full-stack testing profile ---------------------------------------
  # Not started by a plain `docker compose up -d` (LIVE_RUN_GUIDE.md and
  # local dev both depend on that staying postgres+redis only). Bring these
  # up explicitly with `docker compose --profile full up -d --build` to test
  # the containerized app end to end before deploying it anywhere.
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://seo_platform:password@postgres:5432/seo_platform
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://seo_platform:password@postgres:5432/seo_platform
      REDIS_URL: redis://redis:6379
      NODE_ENV: production

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      WEB_API_URL: http://api:3001
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}

volumes:
  postgres_data:
  redis_data:
