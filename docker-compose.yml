services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      # Host port is overridable because a natively-installed Postgres or Redis
      # on the default port silently shadows the container: connections succeed
      # against the wrong server and fail on credentials, which is a confusing
      # way to lose an afternoon. Set POSTGRES_PORT / REDIS_PORT in .env when
      # that happens; the container side never changes, so nothing else does.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: seo_platform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: seo_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # No local S3 emulation here on purpose — use a real low-traffic S3
  # dev bucket for S3/SFTP testing so behavior matches production.

  # --- Full-stack testing profile ---------------------------------------
  # Not started by a plain `docker compose up -d` (LIVE_RUN_GUIDE.md and
  # local dev both depend on that staying postgres+redis only). Bring these
  # up explicitly with `docker compose --profile full up -d --build` to test
  # the containerized app end to end before deploying it anywhere.
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://seo_platform:password@postgres:5432/seo_platform
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Shown in the nav rail and served back from GET /health — see
      # ADR-0043. Defaults to the version this compose file shipped with if
      # `.env` doesn't override it.
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # Bare keys (no `${...:-}` default) so an unset var is OMITTED from the
      # container's environment rather than passed through as an explicit
      # empty string. packages/shared's config schema validates these with
      # `z.string().min(1).optional()` — undefined is fine, but a *present*
      # empty string fails validation and crashes the API at startup. An
      # `${BASIC_AUTH_USER:-}` default here used to manufacture exactly that
      # empty string whenever `.env` left both unset, so "leave them unset for
      # an unprotected deployment" silently meant "the API won't start."
      BASIC_AUTH_USER:
      BASIC_AUTH_PASSWORD:

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://seo_platform:password@postgres:5432/seo_platform
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # The image's own /app is not writable by the non-root worker user (see
      # apps/worker/Dockerfile) — stage sitemap files on a dedicated writable
      # volume instead of the config schema's host-relative `.sitemaps` default.
      SITEMAP_STORE_ROOT: /data/sitemaps
    volumes:
      - worker_sitemaps:/data/sitemaps

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      WEB_API_URL: http://api:3001
      # Shown in the nav rail under the logo — see ADR-0043.
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # See the comment on the `api` service above — bare keys forward from
      # `.env` only when actually set, instead of manufacturing an explicit
      # empty string that `apps/web/middleware.ts`'s `=== undefined` check
      # would treat as "configured" and lock every request out.
      BASIC_AUTH_USER:
      BASIC_AUTH_PASSWORD:

volumes:
  postgres_data:
  redis_data:
  worker_sitemaps:
